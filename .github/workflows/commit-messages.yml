name: Commit messages

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Task ID in every commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Work out which commits are new
        id: range
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            range="$PR_BASE..$PR_HEAD"
          elif [ -n "$BEFORE" ] && ! echo "$BEFORE" | grep -qE '^0+$' && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            range="$BEFORE..$AFTER"
          else
            # New branch, or a force-push whose old tip is gone: check what isn't on the default branch yet.
            range="origin/$DEFAULT_BRANCH..$AFTER"
          fi
          echo "range=$range" >> "$GITHUB_OUTPUT"

      - name: Check commit messages
        run: node scripts/check-commit-messages.mts "${{ steps.range.outputs.range }}"
