name: Commit messages

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Task ID in every commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Work out which commits are new
        id: range
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: echo "range=$(sh scripts/push-range.sh)" >> "$GITHUB_OUTPUT"

      - name: Check commit messages
        run: node scripts/check-commit-messages.mts "${{ steps.range.outputs.range }}"
